global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: vehicle-service
    metrics_path: /metrics
    static_configs:
      - targets: [vehicle-service:8000]

  - job_name: telemetry-service
    metrics_path: /metrics
    static_configs:
      - targets: [telemetry-service:8000]

  - job_name: alert-service
    metrics_path: /metrics
    static_configs:
      - targets: [alert-service:8000]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
