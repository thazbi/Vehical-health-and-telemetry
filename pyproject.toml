[project]
name = "automotive-microservice-monitoring"
version = "0.1.0"
description = "Foundation for an automotive microservice health monitoring system"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
